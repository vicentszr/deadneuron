<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de cuenta Deadneuron</title>
  <link rel="stylesheet" href="style.css">
  <script src="registro.js" defer></script>
</head>
<body>
  <header class="cabecera">
    <h1>deadneuron</h1>
    <nav>
      <ul>
        <li><a href="index.html#inicio">Inicio</a></li>
        <li><a href="index.html#entradas">Entradas</a></li>
        <li><a href="index.html#sobre">Sobre el blog</a></li>
        <li><a href="index.html#contacto">Contacto</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2>Crear cuenta</h2>
    <form id="registro" novalidate>
     <div class="campo">
       <label for="email">Correo electrónico</label>
       <input type="email" id="email" name="email">
       <span class="error"></span>
     </div>
     <div class="campo">
        <label for="email2">Repetir email</label>
        <input type="email" id="email2" name="email2">
        <span class="error"></span>
     </div>
     <div class="campo">
       <label for="nombre">Usuario</label>
       <input type="text" id="nombre" name="nombre">
       <span class="error"></span>
     </div>
     <div class="campo">
       <label for="password">Contraseña</label>
       <input type="password" id="password" name="password">
       <span class="error"></span>
     </div>
     <div class="campo">
        <label for="password2">Repetir Contraseña</label>
        <input type="password" id="password2" name="password2">
        <span class="error"></span>
     </div>


     <button type="submit">Crear cuenta</button>
     <p id="resultado"></p>
    </form>
  </main>

  <footer id="contacto">
    <p>Vicente Sánchez Reza · Universidad Alfonso X el Sabio</p>
  </footer>

</body>
</html>
